
components:

  schemas:

    PropertyValue:
      oneOf:
        - type: string
        - type: number
        - type: boolean

    PropertyMap:
      type: object
      description: >
        Properties in a request, where each property has either a single value or an array of
        values
      additionalProperties:
        oneOf:
          - $ref: '#/components/schemas/PropertyValue'
          - type: array
            items:
              $ref: '#/components/schemas/PropertyValue'

    PropertyValuesMap:
      type: object
      description: Properties where each value is an array of values
      additionalProperties:
        type: array
        items: {}

    Relationship:
      type: object
      properties:
        targetId:
          type: string
        relationshipType:
          type: string
        definitionName:
          type: string
        policyName:
          type: string
        properties:
          $ref: '#/components/schemas/PropertyMap'
      required:
        - targetId
        - relationshipType
      additionalProperties: false

    RelationshipList:
      type: array
      items:
        $ref: '#/components/schemas/Relationship'

    RelationshipDetails:
      type: object
      properties:
        subjectId:
          type: string
        targetId:
          type: string
        relationshipType:
          type: string
        definitionName:
          type: string
        policyName:
          type: string
        properties:
          $ref: '#/components/schemas/PropertyValuesMap'
      required:
        - targetId
        - relationshipType
        - properties

    RelationshipDetailsList:
      type: array
      items:
        $ref: '#/components/schemas/RelationshipDetails'

    Subject:
      type: object
      properties:
        definitionName:
          type: string
        properties:
          $ref: '#/components/schemas/PropertyMap'
        relationships:
          $ref: '#/components/schemas/RelationshipList'
      additionalProperties: false

    NamedSubject:
      type: object
      properties:
        subjectId:
          type: string
        definitionName:
          type: string
        properties:
          $ref: '#/components/schemas/PropertyMap'
        relationships:
          $ref: '#/components/schemas/RelationshipList'
      required:
        - subjectId
      additionalProperties: false

    NamedSubjectList:
      type: array
      items:
        $ref: '#/components/schemas/NamedSubject'

    SubjectDetails:
      type: object
      properties:
        subjectId:
          type: string
        definitionName:
          type: string
        properties:
          $ref: '#/components/schemas/PropertyValuesMap'
        relationships:
          $ref: '#/components/schemas/RelationshipDetailsList'
      required:
        - subjectId
        - properties
        - relationships

    SubjectBatchResponse:
      type: object
      properties:
        successCount:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              offset:
                type: integer
              errorMsg:
                type: string
            required:
              - offset
              - errorMsg
      required:
        - successCount
        - errors

    Member:
      type: object
      properties:
        name:
          type: string
        definitionName:
          type: string
        properties:
          $ref: '#/components/schemas/PropertyMap'
      required:
        - name

    MemberList:
      type: array
      items:
        $ref: '#/components/schemas/Member'

    MemberDetails:
      type: object
      properties:
        groupName:
          type: string
        name:
          type: string
        definitionName:
          type: string
        properties:
          $ref: '#/components/schemas/PropertyValuesMap'
      required:
        - name
        - properties

    MemberDetailsResponse:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberDetails'
      required:
        - members

    Group:
      type: object
      properties:
        definitionName:
          type: string
        members:
          $ref: '#/components/schemas/MemberList'
        properties:
          $ref: '#/components/schemas/PropertyMap'

    GroupDetails:
      type: object
      properties:
        groupName:
          type: string
        definitionName:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberDetails'
        properties:
          $ref: '#/components/schemas/PropertyValuesMap'
      required:
        - groupName
        - members
        - properties
