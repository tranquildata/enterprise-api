components:

  schemas:

    PolicyXMLContent:
      type: string

    PolicyJSONContent:
      type: object

    EncodedContent:
      type: string
      format: byte
      description: The content exactly as it was provisioned, base64-encoded

    PolicyDetails:
      type: object
      properties:
        name:
          type: string
        entityVersion:
          type: integer
        contentType:
          type: string
        content:
          $ref: '#/components/schemas/EncodedContent'
      required:
        - name

    PolicyList:
      type: array
      items:
        $ref: '#/components/schemas/PolicyDetails'

    ModelContent:
      type: object

    ModelDetails:
      type: object
      properties:
        name:
          type: string
        entityVersion:
          type: integer
        contentType:
          type: string
        content:
          $ref: '#/components/schemas/EncodedContent'
      required:
        - name

    ModelList:
      type: array
      items:
        $ref: '#/components/schemas/ModelDetails'

    PropertyMap:
      type: object
      additionalProperties:
        type: string

    PeerDetails:
      type: object
      properties:
        identifier:
          type: integer
        certificate:
          type: string
          description: >
            The PEM-encoded Public Key Certificate of the peer (before version 1.1.0 of this API,
            the PEM was base64-encoded)
        entityVersion:
          type: integer
        policyName:
          type: string
          description: Present only if details were requested
        properties:
          allOf:
            - $ref: '#/components/schemas/PropertyMap'
          description: Present only if details were requested
      required:
        - identifier
        - certificate

    PeerList:
      type: array
      items:
        $ref: '#/components/schemas/PeerDetails'

    AddedPeer:
      type: object
      description: >
        The identifier of the new peer, and the details that it needs to enter the service
        through the peer that handled the request
      properties:
        identifier:
          type: integer
          description: The identifier of the new peer
        entryIdentifier:
          type: integer
          description: The identifier of the peer that handled the request
        entryHost:
          type: string
          description: The host of the peer that handled the request
        entryPort:
          type: integer
          description: The port of the peer that handled the request
        entryCertificate:
          type: string
          description: >
            The PEM-encoded Public Key Certificate of the peer that handled the request (before
            version 1.1.0 of this API, the PEM was base64-encoded)
      required:
        - identifier
        - entryIdentifier
        - entryHost
        - entryPort
        - entryCertificate

    DomainDetails:
      type: object
      properties:
        name:
          type: string
        entityVersion:
          type: integer
        policyName:
          type: string
        modelName:
          type: string
      required:
        - name

    DomainList:
      type: array
      items:
        $ref: '#/components/schemas/DomainDetails'

    SchemaJSONContent:
      type: object

    SchemaDetails:
      type: object
      properties:
        entityVersion:
          type: integer
        contentType:
          type: string
        content:
          $ref: '#/components/schemas/EncodedContent'
      required:
        - entityVersion
        - contentType
        - content

    ResolverGroupJSONContent:
      type: object

    ResolverGroupDetails:
      type: object
      properties:
        name:
          type: string
        entityVersion:
          type: integer
        contentType:
          type: string
        content:
          $ref: '#/components/schemas/EncodedContent'
      required:
        - name
        - entityVersion
        - contentType
        - content
